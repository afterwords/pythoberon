name: bc250-pxe

services:
  # TFTP service serving x86_64 UEFI iPXE bootloader (ipxe.efi)
  # Host networking is required for TFTP/PXE due to dynamic UDP port negotiation.
  tftp:
    image: alpine:3.20
    container_name: bc250-tftp
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./tftp:/srv/tftp:ro
    command: >
      sh -c "apk add --no-cache tftp-hpa || exit 1;
             syslogd -O - &
             exec /usr/sbin/in.tftpd -L -v -s /srv/tftp"

  # HTTP service serving boot.ipxe, Arch Linux squashfs/kernel, and provision scripts
  web:
    image: nginx:alpine
    container_name: bc250-web
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./config.env:/usr/share/nginx/html/provision/config.env:ro
      - ./scripts/setup-llama-server.sh:/usr/share/nginx/html/provision/setup-llama-server.sh:ro
